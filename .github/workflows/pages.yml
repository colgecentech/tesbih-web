# Siteyi GitHub Pages'e yayınlar.
#
# Ayarlar → Pages → Source: "GitHub Actions" seçiliyken çalışır. "Deploy from
# a branch" seçiliyse bu iş akışı hata verir; o durumda GitHub'ın dal tabanlı
# yayını kullanılır ve bu dosyaya gerek kalmaz.
name: Siteyi yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v5
